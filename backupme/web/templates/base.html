<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BackupMe Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://unpkg.com/htmx.org@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #242736;
      --border: #2a2d3a; --text: #e1e4ed; --text2: #8b8fa3;
      --accent: #6c8cff; --accent2: #4a6ae0; --green: #34d399; --red: #f87171;
      --yellow: #fbbf24; --sidebar: 220px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); display: flex; min-height: 100vh;
    }
    .sidebar {
      width: var(--sidebar); background: var(--surface); border-right: 1px solid var(--border);
      padding: 1.25rem 0; position: fixed; top: 0; left: 0; height: 100vh; overflow-y: auto;
    }
    .sidebar h1 { font-size: 1.1rem; padding: 0 1rem 1.25rem; color: var(--accent); letter-spacing: 0.5px; }
    .sidebar nav { display: flex; flex-direction: column; gap: 2px; }
    .sidebar a {
      color: var(--text2); text-decoration: none; padding: 0.6rem 1rem; font-size: 0.9rem;
      border-left: 3px solid transparent; transition: 0.15s;
    }
    .sidebar a:hover, .sidebar a.active { color: var(--text); background: var(--surface2); border-left-color: var(--accent); }
    .main { margin-left: var(--sidebar); flex: 1; padding: 1.5rem 2rem; max-width: calc(100vw - var(--sidebar)); }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 1.25rem; margin-bottom: 1rem;
    }
    .card h2 { font-size: 0.85rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem;
    }
    .stat-card .label { font-size: 0.75rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.4px; }
    .stat-card .value { font-size: 1.6rem; font-weight: 600; margin-top: 0.25rem; }
    .stat-card .sub { font-size: 0.8rem; color: var(--text2); margin-top: 0.15rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { text-align: left; padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); }
    th { color: var(--text2); font-weight: 500; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.3px; }
    td { color: var(--text); }
    tr:hover td { background: var(--surface2); }
    input, select {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
      padding: 0.5rem 0.75rem; color: var(--text); font-size: 0.88rem;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    .btn {
      background: var(--accent); color: #fff; border: none; border-radius: 6px;
      padding: 0.5rem 1rem; font-size: 0.85rem; cursor: pointer; transition: 0.15s;
    }
    .btn:hover { background: var(--accent2); }
    .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.8rem; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: var(--surface2); border-color: var(--text2); }
    .badge {
      display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px;
      font-size: 0.75rem; font-weight: 500;
    }
    .badge-green { background: rgba(52,211,153,0.15); color: var(--green); }
    .badge-red { background: rgba(248,113,113,0.15); color: var(--red); }
    .badge-yellow { background: rgba(251,191,36,0.15); color: var(--yellow); }
    .badge-gray { background: rgba(139,143,163,0.15); color: var(--text2); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .dot-green { background: var(--green); }
    .dot-red { background: var(--red); }
    .dot-yellow { background: var(--yellow); }
    .flex { display: flex; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .gap-2 { gap: 0.5rem; }
    .gap-3 { gap: 0.75rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-3 { margin-bottom: 0.75rem; }
    .mt-3 { margin-top: 0.75rem; }
    .truncate { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-bar {
      display: flex; gap: 0.75rem; align-items: center; padding: 0.5rem 0; font-size: 0.8rem; color: var(--text2);
    }
    .status-bar .dot { margin-right: 2px; }
    .chart-container { max-width: 500px; margin: 0 auto; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    pre { background: var(--surface2); padding: 0.75rem; border-radius: 6px; overflow-x: auto; font-size: 0.8rem; color: var(--text2); }
    .empty { text-align: center; padding: 2rem; color: var(--text2); font-size: 0.9rem; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h1>BackupMe</h1>
    <nav>
      <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
      <a href="/files" class="{% if request.url.path.startswith('/files') %}active{% endif %}">Files</a>
      <a href="/backends" class="{% if request.url.path == '/backends' %}active{% endif %}">Backends</a>
      <a href="/logs" class="{% if request.url.path == '/logs' %}active{% endif %}">Activity</a>
      <a href="/database" class="{% if request.url.path == '/database' %}active{% endif %}">DB Health</a>
      <a href="/report" class="{% if request.url.path == '/report' %}active{% endif %}">Report</a>
      <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">Settings</a>
    </nav>
  </aside>
  <div class="main">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
