name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package (editable)
        run: pip install -e .
      - name: CLI smoke
        run: backupme --help
      - name: Build wheel (validates pyproject packaging)
        run: |
          pip install build
          python -m build --wheel
      - name: Run test suite
        run: python -m pytest tests/ -q
