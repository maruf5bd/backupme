name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package (editable)
        run: pip install -e .
      - name: CLI smoke
        run: backupme --help
      - name: Build wheel (validates pyproject packaging)
        run: |
          pip install build
          python -m build --wheel
      - name: Wheel ships dashboard assets
        run: |
          python -c "import glob, zipfile; wheel = glob.glob('dist/*.whl')[0]; names = zipfile.ZipFile(wheel).namelist(); assert any('web/templates/dashboard.html' in n for n in names), 'templates missing from wheel'; assert any('web/static/' in n for n in names), 'static missing from wheel'; print('dashboard assets in wheel: OK')"
      - name: Run test suite
        run: python -m pytest tests/ -q
